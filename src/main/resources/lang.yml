lang-version: 1
# ==============================================================================
# TotalXPRewards Language File
#
# Customize the plugin's messages here.
# Supports color codes using '&' (e.g. &a for green).
# ==============================================================================

# General Messages
# ------------------------------------------------------------------------------
prefix: "&7[&aTotalXP&7] "
reload-done: "&aConfiguration and language files reloaded successfully."

# Error Messages
# ------------------------------------------------------------------------------
no-permission: "&cYou do not have permission to execute this command."
player-not-found: "&cPlayer not found or never played before."
invalid-number: "&cInvalid number. Please enter a valid integer."
negative-amount: "&cXP amount cannot be negative."

# XP Management Messages
# ------------------------------------------------------------------------------
xp-view: "&a%player% currently has &e%xp% &arank XP."
xp-set: "&aSuccessfully set &e%player%&a's rank XP to &e%amount%."
xp-reset: "&aSuccessfully reset rank XP for &e%player%&a."
max-rank: "Max Rank"

progression-help: "&f/%label% status [Spieler] &7Rang-XP und Budget (fremde Spieler: Admin)"
progression-status: "&e%player% &7| &a%xp% Rang-XP &7| Budget: &a%budget%/%capacity% &7| %active% &7| Aktiv: %hours% h &7| Schutz: %enabled% &7| Letzter Grund: %reason%"
progression-limited: "&eRang-XP begrenzt: %reason% &7| Budget: %budget% &7| Minecraft-XP bleiben erhalten."
progression-config-error: "&cUngültige Konfiguration. Bisherige Einstellungen bleiben aktiv:"
progression-active: "aktiv"
progression-inactive: "inaktiv"
progression-enabled: "an"
progression-disabled: "aus"
progression-reason-none: "keine Begrenzung"
progression-reason-budget: "Rang-XP-Budget"
progression-reason-farm: "Mob-Farm"
progression-reason-farm+budget: "Mob-Farm und Rang-XP-Budget"

# Help Menu
# ------------------------------------------------------------------------------
help:
  - "&8&m-------------------------------------------"
  - "&a&lTotal XP Rewards &7v1.0.1"
  - ""
  - "&f/%label% get <player>       &7Check a player's total XP"
  - "&f/%label% show               &7Show your BossBar"
  - "&f/%label% hide               &7Hide your BossBar"
  - "&c/%label% set <player> <xp>  &7Set a player's XP (Admin)"
  - "&c/%label% reset <player>     &7Reset a player's XP (Admin)"
  - "&c/%label% reload             &7Reload configuration (Admin)"
  - "&8&m-------------------------------------------"
