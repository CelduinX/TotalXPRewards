rewards:
  # Configure rewards here. The key (e.g. '1000') is the XP threshold.
  #
  # 'name':      The display name of this rank. Used in %current_rank%/%next_rank%.
  # 'commands':  List of commands to run (without /). Run as CONSOLE.
  # 'broadcast': Message to broadcast to the server when reached.
  # 'scoreboard-rewards': Optional display lines for the sidebar. If absent,
  #   vanilla 'give %player% <item> <amount>' commands are shown automatically.
  #   Set this for rewards from other plugins or custom descriptions.
  #
  # BALANCING:
  # - 100 ranks
  # - Rank 1 starts at 160 accumulated XP
  # - Rank 100 is reached at 30,000 accumulated XP
  # - Designed for roughly one month of regular Survival play without XP farms
  # - Early ranks come faster; later rank gaps rise gradually to about 350-400 XP
  #
  # -----------------------------------------------------------------------
  # RANGSYSTEM - NOOBS & LEGENDS (Fortnite/RPG Color Style)
  # Grau -> Grün -> Blau -> Lila -> Gold
  # -----------------------------------------------------------------------

